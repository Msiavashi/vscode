name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['.github/pages/**', '.github/workflows/pages.yml', 'build/next/index.ts']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: .github/pages/install.sh
      - run: npm run gulp vscode-web-min
      - name: Render index.html
        run: node .github/pages/make-index.mjs ../vscode-web "/${GITHUB_REPOSITORY#*/}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ../vscode-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
